name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - run: uv sync --all-packages --all-extras --locked

      # ruff covers the whole workspace (imprint-mem + imprint-server) from root
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .

      # pyright for imprint-mem (root config: src/, tests/, examples/)
      - run: uv run pyright

      # pyright for imprint-server (separate config in imprint-server/pyproject.toml)
      - run: cd imprint-server && uv run pyright

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - run: uv sync --all-packages --all-extras --locked

      - run: uv run pytest

  server-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - run: uv sync --all-packages --all-extras --locked

      - run: cd imprint-server && uv run pytest
