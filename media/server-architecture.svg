<svg viewBox="0 0 480 320" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono', 'Fira Code', monospace">
<defs>
  <marker id="a" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="5" markerHeight="5" orient="auto">
    <path d="M0,.5 L9,4 L0,7.5Z" fill="#94a3b8"/>
  </marker>
</defs>

<rect width="480" height="320" rx="8" fill="#fafaf8" stroke="#e2e8f0" stroke-width="1"/>

<!-- incoming label -->
<text x="240" y="20" text-anchor="middle" font-size="9" fill="#64748b" letter-spacing="0.04em">HTTP client / MCP client</text>
<line x1="240" y1="24" x2="240" y2="38" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#a)"/>

<!-- AuthMiddleware -->
<rect x="100" y="40" width="280" height="32" rx="4" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
<text x="240" y="60" text-anchor="middle" font-size="10" fill="#0f172a">AuthMiddleware</text>
<line x1="240" y1="72" x2="240" y2="86" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#a)"/>

<!-- RateLimitMiddleware -->
<rect x="100" y="88" width="280" height="32" rx="4" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
<text x="240" y="104" text-anchor="middle" font-size="10" fill="#0f172a">RateLimitMiddleware</text>
<text x="240" y="116" text-anchor="middle" font-size="8" fill="#64748b">Redis, optional</text>
<line x1="240" y1="120" x2="240" y2="134" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#a)"/>

<!-- Router -->
<rect x="100" y="136" width="280" height="32" rx="4" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
<text x="240" y="152" text-anchor="middle" font-size="10" fill="#0f172a">Router</text>
<text x="240" y="164" text-anchor="middle" font-size="8" fill="#64748b">/v1/agents/* /health /metrics /admin /mcp</text>
<line x1="240" y1="168" x2="240" y2="182" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#a)"/>

<!-- AgentRegistry -->
<rect x="100" y="184" width="280" height="32" rx="4" fill="#0d9488" stroke="#0d9488" stroke-width="1.5"/>
<text x="240" y="200" text-anchor="middle" font-size="10" fill="white" font-weight="500">AgentRegistry</text>
<text x="240" y="212" text-anchor="middle" font-size="8" fill="rgba(255,255,255,0.8)">per-agent Imprint instances</text>
<line x1="240" y1="216" x2="240" y2="230" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#a)"/>

<!-- Storage row -->
<!-- MemoryStore -->
<rect x="40" y="232" width="180" height="52" rx="4" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
<text x="130" y="252" text-anchor="middle" font-size="10" fill="#0f172a">MemoryStore</text>
<text x="130" y="265" text-anchor="middle" font-size="8" fill="#64748b">SQLite</text>
<text x="130" y="276" text-anchor="middle" font-size="8" fill="#64748b">Postgres + pgvector</text>

<!-- VectorStore -->
<rect x="260" y="232" width="180" height="52" rx="4" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5" stroke-dasharray="5,3"/>
<text x="350" y="252" text-anchor="middle" font-size="10" fill="#0f172a">VectorStore</text>
<text x="350" y="265" text-anchor="middle" font-size="8" fill="#64748b">SQLite-vec</text>
<text x="350" y="276" text-anchor="middle" font-size="8" fill="#64748b">pgvector  (optional)</text>

<!-- lines from AgentRegistry to stores -->
<line x1="180" y1="216" x2="130" y2="230" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#a)"/>
<line x1="300" y1="216" x2="350" y2="230" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#a)"/>

<!-- Redis badge (side) -->
<rect x="360" y="88" width="100" height="32" rx="4" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
<text x="410" y="104" text-anchor="middle" font-size="9" fill="#92400e">Redis</text>
<text x="410" y="116" text-anchor="middle" font-size="8" fill="#b45309">cache + rate limit</text>
<line x1="360" y1="104" x2="382" y2="104" stroke="#f59e0b" stroke-width="1.3" stroke-dasharray="3,2"/>

<!-- labels -->
<text x="40" y="300" font-size="8" fill="#94a3b8">solid border = always present</text>
<text x="40" y="312" font-size="8" fill="#94a3b8">dashed border = optional</text>

</svg>
