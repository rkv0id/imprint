[project]
name = "imprint-server"
version = "0.3.0"
description = "Networked memory service for AI agents, built on imprint-mem."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "imprint-mem>=0.5.3",
    "aiosqlite>=0.20",
    "fastapi[standard]>=0.115",
    "pydantic-settings>=2.3",
    "mcp>=1.0",
    "typer>=0.12",
    "prometheus-client>=0.20",
]

[project.urls]
Repository = "https://github.com/rkv0id/imprint"
Issues = "https://github.com/rkv0id/imprint/issues"

[project.optional-dependencies]
postgres = [
    "asyncpg>=0.29",
]
redis = [
    "redis>=5.0",
]

[project.scripts]
imprint-server = "imprint_server.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/imprint_server"]

[tool.uv]
python-preference = "only-managed"

[tool.uv.sources]
imprint-mem = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "pyright>=1.1.390",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "DTZ"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = ".."
venv = ".venv"

[[tool.pyright.executionEnvironments]]
root = "tests"
reportPrivateUsage = "none"
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"
reportUnknownArgumentType = "none"

# asyncpg has no type stubs. All type-ignore comments are in _pool.py only.
# Code that uses PgPool and PgConnection has full type coverage.
# reportUnusedFunction covers FastMCP @mcp.tool() decorated local functions --
# pyright sees them as unused because they are registered via decorator, not
# accessed by name. This is a genuine false positive with no fix.
[[tool.pyright.executionEnvironments]]
root = "tests"
reportPrivateUsage = "none"
reportUnknownVariableType = "none"
reportUnknownArgumentType = "none"

[[tool.pyright.executionEnvironments]]
root = "src/imprint_server/mcp"
reportUnusedFunction = "none"

[[tool.pyright.executionEnvironments]]
root = "src/imprint_server/cli.py"
reportUnusedFunction = "none"

# redis.asyncio has no type stubs. All type-ignore comments are in redis.py only.
[[tool.pyright.executionEnvironments]]
root = "src/imprint_server/redis.py"
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"

[tool.pytest.ini_options]
addopts = "-ra -m 'not live and not postgres'"
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::pytest.PytestUnhandledThreadExceptionWarning",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]
markers = [
    "live: tests that hit live external services (excluded by default)",
    "postgres: tests that require a running Postgres instance (run with `just server-postgres-test`)",
]
