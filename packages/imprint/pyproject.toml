[project]
name = "imprint"
version = "0.1.0a1"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
]
description = "Memory infrastructure for AI agents — client SDK"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/imprint"]
