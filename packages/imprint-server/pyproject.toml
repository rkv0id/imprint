[project]
name = "imprint-server"
version = "0.1.0a1"
requires-python = ">=3.12"
dependencies = [
    "imprint",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
]
description = "Memory infrastructure for AI agents — server"

[project.scripts]
imprint = "imprint_server.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/imprint_server"]
