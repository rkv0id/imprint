[project]
name = "imprint-mem"
version = "0.4.2"
description = "A Python library that gives AI agents memory."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "pydantic>=2.7",
    "aiosqlite>=0.20",
    "pydantic-ai-slim[anthropic]>=0.0.14",
]

[project.urls]
Repository = "https://github.com/rkv0id/imprint"
Issues = "https://github.com/rkv0id/imprint/issues"

[project.optional-dependencies]
vector = [
    "sqlite-vec>=0.1.6",
]
voyage = [
    "voyageai>=0.3",
    "numpy>=1.26",
]
anthropic = [
    "anthropic>=0.40",
]
online = [
    "river>=0.22",
]
openai = [
    "openai>=1.0",
    "tiktoken>=0.6",
]
postgres = [
    "asyncpg>=0.29",
]
langchain = [
    "langchain-core>=0.1",
]
llamaindex = [
    "llama-index-core>=0.10",
]
all = [
    "imprint-mem[vector,voyage,anthropic,online,openai,langchain,llamaindex,postgres]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/imprint"]

[tool.uv]
python-preference = "only-managed"

[tool.uv.sources]
imprint = { path = ".", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "pyright>=1.1.390",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "DTZ"]

[tool.pyright]
include = ["src", "tests", "examples"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[[tool.pyright.executionEnvironments]]
root = "tests"
reportPrivateUsage = "none"
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"
reportUnknownArgumentType = "none"

[[tool.pyright.executionEnvironments]]
root = "src/imprint/_utils.py"
reportPrivateUsage = "none"
reportUnusedFunction = "none"

[[tool.pyright.executionEnvironments]]
root = "src/imprint/_scope.py"
reportPrivateUsage = "none"
reportUnusedClass = "none"

[[tool.pyright.executionEnvironments]]
root = "src/imprint/_observe.py"
reportPrivateUsage = "none"
reportUnusedClass = "none"

[[tool.pyright.executionEnvironments]]
root = "src/imprint/_policy.py"
reportPrivateUsage = "none"
reportUnusedClass = "none"

[[tool.pyright.executionEnvironments]]
root = "src/imprint/_feedback.py"
reportPrivateUsage = "none"
reportUnusedClass = "none"

[[tool.pyright.executionEnvironments]]
root = "src/imprint/_core.py"
reportPrivateUsage = "none"


[[tool.pyright.executionEnvironments]]
root = "src/imprint/stores/postgres.py"
reportPrivateUsage = "none"
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"
reportUnknownArgumentType = "none"
reportUnknownParameterType = "none"
reportMissingTypeStubs = "none"
reportMissingImports = "none"
reportInvalidTypeArguments = "none"

[[tool.pyright.executionEnvironments]]
root = "examples"
reportPrivateUsage = "none"
reportUnknownVariableType = "none"
reportUnknownMemberType = "none"
reportUnknownLambdaType = "none"
reportMissingTypeArgument = "none"
reportUnknownParameterType = "none"
reportUnknownArgumentType = "none"

[tool.pytest.ini_options]
addopts = "-ra -m 'not live'"
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::pytest.PytestUnhandledThreadExceptionWarning",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]
markers = [
    "live: tests that hit live external services (excluded by default; run with `just test-live`)",
]
